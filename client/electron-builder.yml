appId: io.github.jessefather.slurmate
productName: Slurmate
# 安装包属性里的版权行（Windows 的 LegalCopyright、Linux 的 deb control 都从这里取）。
# 与根目录 NOTICE 说的是同一件事 —— 署名只有一处定义，这里跟着它。
copyright: Copyright 2026 JesseFather

directories:
  output: dist
  buildResources: build

# 只打包运行需要的东西。测试、CI 配置、文档都不进安装包。
#
# 假站点那几个模块只服务客户端自己的测试（`SLURMATE_TEST_BACKEND=1`，而且只在
#   非打包版生效），安装包里一个都不带。`backend.js` 那一条 `require` 只在
#   测试分支里跑，所以拿掉它们不会让打包版少任何运行时依赖。
files:
  - src/**/*
  - package.json
  - '!**/*.map'
  - '!test/**'
  - '!src/main/backend-fake.js'
  - '!src/main/fake-job.js'
  - '!src/main/fake-job-host.sh'
  - '!src/main/demo-server.js'
  - '!src/preload/demo.js'
  - '!src/demo/**'

asar: true

# ── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  # Windows 单独一份：方底铺满整块画布（矢量源 icon-win.svg）。Windows 不像
  #   macOS 那样替图标留边，同一张留白的图放进任务栏会比别的程序小一圈，
  #   底下再垫一层白底就成了"白框里一个小方框"（2026-10-24 报的）。
  #   两份 PNG 都是透底的，方底以外的地方不许有颜色。
  #   打包时由 app-builder 转成 .ico；窗口图标（windows.js 的 `icon`）仍读
  #   icon.png —— 那是运行期的同一份资产，与安装包里的图标是两处。
  #   写死路径而不是靠 buildResources 的默认约定：那张图还要进 asar 给运行期用，
  #   放在 src 里才一份文件管两处。
  icon: src/renderer/icon-win.png
  # 未签名。首次运行 SmartScreen 会拦一次，选「更多信息 → 仍要运行」。
  # 内部分发可以接受；要消除提示需要代码签名证书。

nsis:
  oneClick: false
  perMachine: false            # 装到用户目录，不需要管理员权限
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Slurmate
  artifactName: ${productName}-${version}-win-${arch}.${ext}

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: src/renderer/icon.png
  category: public.app-category.developer-tools
  # 不签名、不公证。后果：Gatekeeper 会拦，用户首次需右键 →「打开」，
  # 或执行 xattr -dr com.apple.quarantine /Applications/Slurmate.app
  # （README 里写了）。要消除这一步需要 Apple 开发者账号。
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# ── Linux ──────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: src/renderer/icon.png
  category: Development
  # .deb 的 fpm 打包要求 maintainer 是 `Name <email>` 格式，且 package.json 里
  # 必须有 homepage —— 两者缺一都会让 deb 目标失败（Windows/macOS 不受影响，
  # 所以只有 Linux 这个矩阵会红）。这里显式写全，不依赖从 author 推导。
  maintainer: "JesseFather <JesseFather@users.noreply.github.com>"
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 自动更新本期不做（没有发布渠道）。留位：
# publish:
#   provider: github
