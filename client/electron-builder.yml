appId: io.github.jessefather.slurmate
productName: Slurmate
copyright: Slurmate

directories:
  output: dist
  buildResources: build

# 只打包运行需要的东西。测试、CI 配置、文档都不进安装包。
files:
  - src/**/*
  - package.json
  - '!**/*.map'
  - '!test/**'

asar: true

# ── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  # 未签名。首次运行 SmartScreen 会拦一次，选「更多信息 → 仍要运行」。
  # 内部分发可以接受；要消除提示需要代码签名证书。

nsis:
  oneClick: false
  perMachine: false            # 装到用户目录，不需要管理员权限
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Slurmate
  artifactName: ${productName}-${version}-win-${arch}.${ext}

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # 不签名、不公证。**后果**：Gatekeeper 会拦，用户首次需右键 →「打开」，
  # 或执行 xattr -dr com.apple.quarantine /Applications/Slurmate.app
  # （README 里写了）。要消除这一步需要 Apple 开发者账号。
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# ── Linux ──────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  # .deb 的 fpm 打包要求 maintainer 是 `Name <email>` 格式，且 package.json 里
  # 必须有 homepage —— 两者缺一都会让 deb 目标失败（Windows/macOS 不受影响，
  # 所以只有 Linux 这个矩阵会红）。这里显式写全，不依赖从 author 推导。
  maintainer: "JesseFather <JesseFather@users.noreply.github.com>"
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 自动更新本期不做（没有发布渠道）。留位：
# publish:
#   provider: github
