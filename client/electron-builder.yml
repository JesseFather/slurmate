appId: io.github.jessefather.slurmate
productName: Slurmate
# 安装包属性里的版权行（Windows 的 LegalCopyright、Linux 的 deb control 都从这里取）。
# 与根目录 NOTICE 说的是同一件事 —— 署名只有一处定义，这里跟着它。
copyright: Copyright 2026 JesseFather

directories:
  output: dist
  buildResources: build

# 只打包运行需要的东西。测试、CI 配置、文档都不进安装包。
files:
  - src/**/*
  - package.json
  - '!**/*.map'
  - '!test/**'

asar: true

# ── 不在 `src/` 里的那两样 ──────────────────────────────────────────────────
# 客户端的运行期只读 `client/` 里的东西，例外只有这两处，而且都只在开发者模式里：
# 开发者模式要它们，它们的家却不在这儿。`client/src/main/app-assets.js` 里那份
# 算法与下面是同一件事的两半 —— 改一处就要改另一处，`client/test/packaging.test.mjs`
# 钉着这一对。
#
# 从前这两条一条都没有，于是打包版上：假站点打不出包（客户端一份插件都收不到），
# 就算打出来了，外部 bash 也读不了 asar 里的那段宿主脚本。
extraResources:
  # 打包器。假站点要现打一个客户端侧容器才能把插件发给客户端，而容器格式只有
  # 那一份实现 —— 手搓第二份就是两个会漂的东西。它是单文件、零依赖，带上很便宜。
  - from: ../packer/slurmate-packer.js
    to: packer/slurmate-packer.js

# 替身宿主。它要交给一个外部 bash 去读，而外部进程读不了 asar 里的文件，
# 所以这一份必须解出来。
asarUnpack:
  - src/main/fake-job-host.sh

# ── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  # 未签名。首次运行 SmartScreen 会拦一次，选「更多信息 → 仍要运行」。
  # 内部分发可以接受；要消除提示需要代码签名证书。

nsis:
  oneClick: false
  perMachine: false            # 装到用户目录，不需要管理员权限
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Slurmate
  artifactName: ${productName}-${version}-win-${arch}.${ext}

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  # 不签名、不公证。后果：Gatekeeper 会拦，用户首次需右键 →「打开」，
  # 或执行 xattr -dr com.apple.quarantine /Applications/Slurmate.app
  # （README 里写了）。要消除这一步需要 Apple 开发者账号。
  identity: null
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# ── Linux ──────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  # .deb 的 fpm 打包要求 maintainer 是 `Name <email>` 格式，且 package.json 里
  # 必须有 homepage —— 两者缺一都会让 deb 目标失败（Windows/macOS 不受影响，
  # 所以只有 Linux 这个矩阵会红）。这里显式写全，不依赖从 author 推导。
  maintainer: "JesseFather <JesseFather@users.noreply.github.com>"
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 自动更新本期不做（没有发布渠道）。留位：
# publish:
#   provider: github
