        dur="1.8s" repeatCount="indefinite" calcMode="spline"
        keySplines="0 0 1 1; 0.1 0 0.3 1; 0.4 0 0.6 1; 0 0 1 1; 0.6 0 1 1; 0 0 1 1"/>
      <path fill="none" stroke="#2E90FA" stroke-width="70" stroke-linecap="round"
