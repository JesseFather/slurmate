<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 与面板、浮窗同一条 CSP：渲染进程只加载本地资源。
     样式必须走外部文件 —— `style-src 'self'` 会把内联 <style> 整块丢掉，
     而丢掉之后没有任何报错，表现只是这一页退回浏览器默认样式：白底、黑字、
     大号标题，与面板的主题完全不搭（用户 2026-10-21 在真机上看到的就是这个）。
     见 hover.css 文件头那一段，同一条陷阱在那里已经写过一次。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';">
<title>提示</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div class="card">
  <h1><span class="dot"></span><span id="title">连接暂时中断</span></h1>
  <p id="text"></p>
  <p class="hint">
    作业仍在集群上运行，这个提示会自己消失。要切到其他会话或面板，用上栏的标签。
  </p>
</div>
<script src="overlay.js"></script>
</body>
</html>
