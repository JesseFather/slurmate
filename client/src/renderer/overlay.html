<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';">
<title>连接中断</title>
<style>
  html, body {
    margin: 0; height: 100%;
    display: grid; place-items: center;
    background: rgba(30, 30, 30, .94); color: #d4d4d4;
    font: 13px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .box { max-width: 520px; text-align: center; padding: 0 24px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #dcdcaa;
    display: inline-block; margin-right: 9px; animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: .2; } }
  h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  p { margin: 0; color: #8a8a8a; }
  #text { color: #d4d4d4; }
  .hint { margin-top: 16px; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <h1><span class="dot"></span>连接暂时中断</h1>
  <p id="text"></p>
  <p class="hint">
    你的计算作业没有受到影响，仍在计算节点上运行。恢复后这个提示会自动消失。
  </p>
</div>
<script src="overlay.js"></script>
</body>
</html>
