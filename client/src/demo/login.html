<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录 — 演示工作区</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1e1e1e; color: #d4d4d4;
  }
  form { width: 320px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .magenta { color: #ff5cf4; font-size: 12px; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: #9cdcfe; margin-bottom: 6px; }
  input {
    width: 100%; padding: 8px 10px; font: inherit; color: #d4d4d4;
    background: #3c3c3c; border: 1px solid #3c3c3c; border-radius: 3px;
  }
  input:focus { outline: 1px solid #007fd4; border-color: #007fd4; }
  button {
    margin-top: 14px; width: 100%; padding: 8px; font: inherit; cursor: pointer;
    background: #0e639c; color: #fff; border: 0; border-radius: 3px;
  }
  button:hover { background: #1177bb; }
  .err { margin-top: 12px; color: #f48771; font-size: 12px; min-height: 1.6em; }
</style>
</head>
<body>
<form method="post" action="/login" id="f">
  <h1>演示工作区</h1>
  <div class="magenta">演示模式 · 未连接集群</div>
  <label for="password">密码</label>
  <!-- 字段名必须是 password —— 这是与 code-server 4.135.0 实测一致的契约 -->
  <input type="password" id="password" name="password" autofocus autocomplete="off">
  <button type="submit">登录</button>
  <div class="err" id="err"></div>
</form>
<script>
  // 演示后端在口令错误时返回 200 + 无 Set-Cookie，与真实 code-server 一致。
  // 所以这里也照实提示，而不是假装成功。
  if (location.search.includes('failed=1')) {
    document.getElementById('err').textContent = '密码不正确。（演示后端行为与真实 code-server 一致：返回 200 但不发 cookie）';
  }
</script>
</body>
</html>
