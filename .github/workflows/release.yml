name: release

# 打 tag（v*）时把三个平台的产物挂到一个 draft Release 上。
#
# ── 为什么这是一个独立的 workflow，而不是 build.yml 里的一个 job ────────────
# 因为那个写法【永远不会触发】，而且不会报任何错。
#
# GitHub 对 push 事件是把 branches、tags、paths 三者取【与】来求值的。
# 常见的打 tag 方式是：
#     git tag v0.1.0 && git push origin v0.1.0
# 这次 push 推送的是一个【已经存在于远程】的提交，变更文件集为空 ——
# 于是 paths 过滤器不匹配，整个 workflow 根本不运行，包括那个 if 判断为真的
# release job。表现为：推了 tag，Actions 页面什么都没发生。
#
# 拆出来之后，本文件【不带任何 paths 过滤器】，只按 tag 触发，这才可靠。
#
# 而 build.yml 仍然带 paths（它要挡掉只改文档的提交）。两个文件各管一件事。
#
# ── 产物是未签名的 ──────────────────────────────────────────────────────────
# Windows 首次运行 SmartScreen 会拦一次（更多信息 → 仍要运行）；
# macOS 首次需右键 →「打开」，或 xattr -dr com.apple.quarantine /Applications/Slurmate.app。
# 消除这一步需要代码签名证书，本项目没有。
#
# ── 发布说明由人写 ──────────────────────────────────────────────────────────
# 不用 generate_release_notes：同一个版本可能先出几个预览版，自动生成的提交
# 列表会把预览那些噪音一起堆进去。draft 里的 notes 由发布者手写。
#
# 正式版的 tag 是 v0.35，预览版是 v0.35-rc1；后者发布时标成 pre-release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # action-gh-release 需要写 Release

jobs:
  # tag 只许打在 main 的历史里。这一遍不跑 checks.yml 那些检查器（它们在每次推
  #   main 与 PR 上跑），所以"tag 打在 main 上已经绿过的提交"是发布的前提。
  #   这里把它做成机器判据：一条本地提交直接打 tag 推上去，会被这一步拦住。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # merge-base 要完整历史
      - name: tag 必须在 main 的历史里
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag 指向的提交不在 main 上：$GITHUB_SHA" >&2
            echo "正式版与预览版都只从 main 的历史里打 tag。" >&2
            exit 1
          fi

  # 不依赖 build.yml —— 它可能因为 paths 过滤器没跑，也可能跑在别的 ref 上。
  # tag 指向的那次提交直接重新构建，保证 Release 上的产物与 tag 一一对应。
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: slurmate-${{ matrix.os }}
          # 注意：`defaults.run.working-directory` 对 `uses:` 步骤无效，
          # 所以这里的路径必须相对仓库根写全。
          path: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.AppImage
            client/dist/*.deb
            client/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # 站点端与打包器，与三个平台的客户端安装包挂在同一个 Release 上。
  #   站点包只是把 cluster/ 的源文件拼起来（tar.gz 加一行标记），打包器是一个
  #   单文件脚本；两者在哪台机器上出都一样，所以钉在 Linux 上，不必进矩阵。
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 cluster/test-run-package.py
      - run: bash cluster/make-run.sh
      - name: 打包器
        run: |
          v="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' cluster/slurmate-sessiond)"
          cp packer/slurmate-packer.js "dist/slurmate-packer-${v}.js"
      - name: 版本号与 tag 的版本一致
        # 包名里的版本号取自 cluster/slurmate-sessiond。tag 是 v0.35（正式版）
        #   或 v0.35-rc1（预览版）时，前半段必须与它相同 —— 对不上时 Release 上
        #   会多出一个与 tag 不同名的文件，而没有人会去核对。
        run: |
          f="$(ls dist/slurmate-site-*.run)"
          v="$(basename "$f" .run)"
          v="${v#slurmate-site-}"
          base="${GITHUB_REF_NAME%%-*}"
          if [ "v$v" != "$base" ]; then
            echo "tag 是 $GITHUB_REF_NAME（版本段 $base），而这一份包叫 $(basename "$f")" >&2
            exit 1
          fi
      - name: 摘要
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: slurmate-base
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, build, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 预览版标记
        # 正式版 tag 是 v0.35；预览版是 v0.35-rc1 这一种形状。
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          # draft: true —— 产物未签名，先让人过一眼；notes 也在这时手写。
          files: artifacts/**/*
          draft: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # 不用 generate_release_notes：同一个版本可能先出几个预览版，
          # 自动生成的提交列表会把预览那些噪音一起堆进来。
