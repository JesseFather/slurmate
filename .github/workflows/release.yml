name: release

# 打 tag（v*）时把三个平台的产物挂到一个 draft Release 上。
#
# ── 为什么这是一个独立的 workflow，而不是 build.yml 里的一个 job ────────────
# 因为那个写法【永远不会触发】，而且不会报任何错。
#
# GitHub 对 push 事件是把 branches、tags、paths 三者取【与】来求值的。
# 常见的打 tag 方式是：
#     git tag v0.1.0 && git push origin v0.1.0
# 这次 push 推送的是一个【已经存在于远程】的提交，变更文件集为空 ——
# 于是 paths 过滤器不匹配，整个 workflow 根本不运行，包括那个 if 判断为真的
# release job。表现为：推了 tag，Actions 页面什么都没发生。
#
# 拆出来之后，本文件【不带任何 paths 过滤器】，只按 tag 触发，这才可靠。
#
# 而 build.yml 仍然带 paths（它要挡掉只改文档的提交）。两个文件各管一件事。
#
# ── 产物是未签名的 ──────────────────────────────────────────────────────────
# Windows 首次运行 SmartScreen 会拦一次（更多信息 → 仍要运行）；
# macOS 首次需右键 →「打开」，或 xattr -dr com.apple.quarantine /Applications/Slurmate.app。
# 消除这一步需要代码签名证书，本项目没有。
#
# ── 发布说明由人写 ──────────────────────────────────────────────────────────
# 不用 generate_release_notes：同一个版本可能先出几个预览版，自动生成的提交
# 列表会把预览那些噪音一起堆进去。draft 里的 notes 由发布者手写。
#
# 正式版的 tag 是 v0.38，预览版是 v0.38-rc1；后者发布时标成 pre-release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # action-gh-release 需要写 Release

jobs:
  # tag 只许打在 main 的历史里。这一遍不跑 checks.yml 那些检查器（它们在 PR 上跑），
  #   所以"tag 指向的提交经过了一次已经绿过的 PR"是发布的前提。
  #   这里把它做成机器判据：一条本地提交直接打 tag 推上去，会被这一步拦住。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # merge-base 要完整历史
      - name: tag 必须在 main 的历史里
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag 指向的提交不在 main 上：$GITHUB_SHA" >&2
            echo "正式版与预览版都只从 main 的历史里打 tag。" >&2
            exit 1
          fi

  # 客户端用例在上面的 test 里跑一遍，三个平台只打各自的包。
  #
  # 不在每个平台各跑一遍测试：客户端用例里有 POSIX 权限位（0600 / 0700）与
  #   符号链接，Windows 上本来就不成立 —— 那会让 Windows 那一格永远红，而红的是
  #   与"这个安装包能不能用"无关的东西。测试验的是代码，平台差异由打包本身暴露。
  test:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  # 不依赖 build.yml —— 它只在手动触发时跑，也可能跑在别的 ref 上。
  # tag 指向的那次提交直接重新构建，保证 Release 上的产物与 tag 一一对应。
  build:
    needs: [guard, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: 打包
        # --publish never：只产出安装包，不碰 Release。
        # --config.buildVersion：安装包文件名用两段的发布标识，与站点包同一个
        #   来源（cluster/slurmate-sessiond 的 RELEASE）。不传时它回落到三段的
        #   产品版本 —— 包里没有错，只是名字与 tag 对不上。
        run: |
          rel="$(sed -n 's/^RELEASE = "\(.*\)"$/\1/p' ../cluster/slurmate-sessiond)"
          if [ -z "$rel" ]; then
            echo "读不到 cluster/slurmate-sessiond 的 RELEASE" >&2
            exit 1
          fi
          npx electron-builder --publish never --config.buildVersion="$rel"
      - name: 文件名里要有发布标识
        # buildVersion 没传上去时，文件名会是三段的产品版本 —— 那与 tag 对不上，
        #   而 Release 上的文件名是管理员与用户认包的唯一依据。
        run: |
          rel="$(sed -n 's/^RELEASE = "\(.*\)"$/\1/p' ../cluster/slurmate-sessiond)"
          if ! ls dist | grep -qF -- "$rel"; then
            echo "dist 里没有一份文件名带 $rel：" >&2
            ls dist >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: slurmate-${{ matrix.os }}
          # 注意：`defaults.run.working-directory` 对 `uses:` 步骤无效，
          # 所以这里的路径必须相对仓库根写全。
          path: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.AppImage
            client/dist/*.deb
            client/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # 站点端与打包器，与三个平台的客户端安装包挂在同一个 Release 上。
  #   站点包只是把 cluster/ 的源文件拼起来（tar.gz 加一行标记），打包器是一个
  #   单文件脚本；两者在哪台机器上出都一样，所以钉在 Linux 上，不必进矩阵。
  site:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 cluster/test-run-package.py
      - run: bash cluster/make-run.sh
      - name: 打包器
        # 文档嵌在这一份文件里，作者不需要基座仓库。默认写到
        #   dist/slurmate-packer-<版本>.js，版本读的是同一个 VERSION 行。
        run: node packer/make-packer.js
      - name: 包名与 tag 逐字一致
        # 两个包名里的发布标识都取自 cluster/slurmate-sessiond 的 `RELEASE`。
        #   tag 与它必须逐字相同（去掉开头的 v）：预览版与正式版是两份不同的
        #   产物，同名覆盖过一次，就再也分不出手里这份是哪一个。
        run: |
          f="$(ls dist/slurmate-site-*.run)"
          v="$(basename "$f" .run)"
          v="${v#slurmate-site-}"
          p="$(ls dist/slurmate-packer-*.js)"
          pv="$(basename "$p" .js)"
          pv="${pv#slurmate-packer-}"
          bad=0
          for got in "$v" "$pv"; do
            if [ "v$got" != "$GITHUB_REF_NAME" ]; then
              echo "tag 是 $GITHUB_REF_NAME，而 dist 里的发布标识是 $got" >&2
              bad=1
            fi
          done
          if [ "$v" != "$pv" ]; then
            echo "站点包与打包器的发布标识不同：$v / $pv" >&2
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "两处都取自 cluster/slurmate-sessiond 的 RELEASE，应当与 tag 逐字相同。" >&2
            exit 1
          fi
      - name: 摘要
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: slurmate-base
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, build, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 预览版标记
        # 正式版 tag 是 v0.38；预览版是 v0.38-rc1 这一种形状。
        id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          # draft: true —— 产物未签名，先让人过一眼；notes 也在这时手写。
          files: artifacts/**/*
          draft: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # 不用 generate_release_notes：同一个版本可能先出几个预览版，
          # 自动生成的提交列表会把预览那些噪音一起堆进来。
