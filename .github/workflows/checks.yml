name: checks

# 与打包无关的检查。跑得很快（不到一分钟），所以每次推都跑，不做 paths 过滤 ——
# 这些检查要防的恰恰是"改了 A 结果弄坏了 B"。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 脱敏回归 ────────────────────────────────────────────────────────────────
  # 这个仓库是公开的，发布前做过一次脱敏。这条检查防的是"真实值又回来了"——
  # 一旦推上去就永久可被索引，改回来也收不回。
  sanitized:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-sanitized.sh
      # ★ 反向验证：种进三份**真的**私钥（三种真实泄漏形态），断言检查会红。
      #   没有这一步，上面那条检查就只是一个"永远通过"的仪式 ——
      #   规则哪天被改松了，没有任何东西会告诉你。
      - run: bash tools/self-test-sanitized.sh

  # ── 客户端自测 ──────────────────────────────────────────────────────────────
  # 不需要 Electron：boot.test.mjs 自己桩掉了 electron 模块，其余测试只用 Node。
  # 这些用例是「静默失败」的回归防线（用例名里带 ★ 的都是），必须在 CI 里跑 ——
  # 只在开发机上手动跑，等于没有防线。
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # ── 集群侧自测 ──────────────────────────────────────────────────────────────
  # 注意：有人可能会以为这个测试需要真集群才能跑。**不需要** ——
  # 它对 Slurm 的调用全部打了桩（替换 run_cmd），测的是解析逻辑本身。
  # 所以它能在裸的 ubuntu-latest 上跑，也【应该】在这里跑：
  # 以前它只在开发机上手动跑过，等于没有回归防线。
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'      # 与部署目标（RHEL 9 系）一致，不用更新的语法
      - name: 守护进程自测
        run: python3 cluster/test-sessiond-logic.py
      - name: 比对器自测
        # nft-compare.py 自带用例，验证"非干扰比对"这个安全保证本身是有效的
        run: python3 cluster/nft-compare.py --selftest

  # ── 语法与一致性 ────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Shell 语法
        run: |
          fail=0
          # ★ '*.sbatch' 必须在这里。作业模板与（部署之后）每插件一份的作业脚本
          #   都是 .sbatch，没有 .sh 后缀 —— 而它们恰恰是**用户真的会执行**的
          #   那两份 shell。此前 run.sbatch 就是从这个清单里漏掉的。
          #   仓库里只有模板（成品在 <prefix>/share/slurmate/jobs/，不进仓库），
          #   所以这条扫的是模板；成品那一份的语法由 deploy.sh 的 bash -n 挡。
          for f in $(git ls-files '*.sh' '*.sbatch' cluster/deploy.sh tools/*.sh); do
            [ -f "$f" ] || continue
            if bash -n "$f"; then echo "  ok   $f"; else echo "  FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Python 语法
        run: |
          fail=0
          for f in cluster/slurmate cluster/slurmate-sessiond cluster/nft-compare.py \
                   cluster/test-sessiond-logic.py; do
            if python3 -m py_compile "$f"; then echo "  ok   $f"; else echo "  FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: 版本号：四处逐字一致，且形状是 x.y
        # 协议版本、客户端版本、服务端版本**是同一个号** —— 它落在四个文件里
        # （client/package.json、client/package-lock.json、cluster/slurmate、
        # cluster/slurmate-sessiond），没有任何机制保证它们同步。
        #
        # ★ **第四处是真的漏过一次的**：client/package-lock.json 从前停在 0.2.0，
        #   而 package.json 已经走到 0.6.0 —— 因为 `npm ci` **不比较**lock 里那个
        #   根 version 字段，所以它一直没人发现。不一致的后果是：安装包叫 0.6，
        #   而它在联系的服务端自称 0.5，排查时无从对起。
        #
        # ★ **形状那一半不在这里重写一遍正则。** 正则的第二个抄本正是这条 lint
        #   要防的那种漂；这里从守护进程 import 那一份（它与客户端
        #   `plugins/index.js` 的 FRAMEWORK_VERSION_RE 由
        #   tools/version-fixtures.json 与两边的用例对齐）。
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util, json, re, sys

          ldr = importlib.machinery.SourceFileLoader("d", "cluster/slurmate-sessiond")
          mod = importlib.util.module_from_spec(
              importlib.util.spec_from_loader("d", ldr))
          ldr.exec_module(mod)
          SHAPE = mod.FRAMEWORK_VERSION_RE

          def daemon_version(path):
              src = open(path, encoding="utf-8").read()
              m = re.search(r'^VERSION\s*=\s*"([^"]+)"', src, re.M)
              return m.group(1) if m else ""

          def from_json(path):
              return json.load(open(path, encoding="utf-8")).get("version") or ""

          places = [
              ("client/package.json", from_json("client/package.json")),
              ("client/package-lock.json", from_json("client/package-lock.json")),
              ("cluster/slurmate", daemon_version("cluster/slurmate")),
              ("cluster/slurmate-sessiond", daemon_version("cluster/slurmate-sessiond")),
          ]
          bad = 0
          for name, v in places:
              ok = bool(v) and SHAPE.match(v) is not None
              print("  %-26s %-10s %s" % (name, v or "(空)", "ok" if ok else "FAIL 不是 x.y"))
              if not ok:
                  bad = 1
          if len({v for _n, v in places}) > 1:
              print("✗ 四处版本号不一致：%s" % sorted(v for _n, v in places))
              print("  改版本时四处都要改（或改成本 workflow 从单一来源派生）。")
              bad = 1
          if bad:
              sys.exit(1)
          print("✓ 四处一致，且都是 x.y")
          PY

      - name: 插件的跳过表两端必须一致
        # ★ 站点分发时，客户端按**自己算的**摘要与站点报的逐份 sha256 比对。两边的
        #   跳过表（哪些目录名不算插件内容）分别在 JS 与 Python 里，**没有任何共享
        #   机制** —— 漂开之后症状是"同步一直失败"，而报错里一个字都不会提到是这两
        #   个集合分家了。
        #
        #   与上面那条"版本号"同一个先例：靠约定维持的跨文件一致性，要有东西钉住。
        #   （cluster/test-sessiond-logic.py 的 19.12 有一条同样意思的用例，本地跑得
        #   到；这里再来一条是因为 CI 上的 lint 是**最外层**的那道网，它不依赖测试
        #   脚本被正确地调用。）
        # ★ 抽的是 `client/src/main/plugins/index.js` —— 那个集合**全客户端只有一份**，
        #   安装器（install.js）从它引，摘要（digestOf）也用它。以前它在 install.js
        #   里，两份实现各自持有一份，正是这条 lint 要防的那种分家。
        run: |
          a=$(sed -nE "s/^const COPY_SKIP = new Set\(\[([^]]*)\]\).*/\1/p" \
                client/src/main/plugins/index.js \
              | tr ',' '\n' | grep -oE "'[^']*'" | tr -d "'" | sort)
          b=$(sed -nE "s/^PLUGIN_COPY_SKIP = \((.*)\)$/\1/p" \
                cluster/slurmate-sessiond \
              | tr ',' '\n' | grep -oE '"[^"]*"' | tr -d '"' | sort)
          echo "客户端 plugins/index.js : $(echo $a)"
          echo "守护进程                : $(echo $b)"
          if [ -n "$a" ] && [ "$a" = "$b" ]; then
            echo "✓ 两端一致"
          else
            echo "✗ 两端的跳过表不一致（或有一边没抽出来）。"
            echo "  它们必须逐字相同：客户端算的摘要要与站点报的对得上。"
            exit 1
          fi
