name: checks

# 与打包无关的检查。跑得很快（不到一分钟），所以每次推都跑，不做 paths 过滤 ——
# 这些检查要防的恰恰是"改了 A 结果弄坏了 B"。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 脱敏回归 ────────────────────────────────────────────────────────────────
  # 这个仓库是公开的，发布前做过一次脱敏。这条检查防的是"真实值又回来了"——
  # 一旦推上去就永久可被索引，改回来也收不回。
  sanitized:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-sanitized.sh
      # ★ 反向验证：种进三份**真的**私钥（三种真实泄漏形态），断言检查会红。
      #   没有这一步，上面那条检查就只是一个"永远通过"的仪式 ——
      #   规则哪天被改松了，没有任何东西会告诉你。
      - run: bash tools/self-test-sanitized.sh

  # ── 客户端自测 ──────────────────────────────────────────────────────────────
  # 不需要 Electron：boot.test.mjs 自己桩掉了 electron 模块，其余测试只用 Node。
  # 这些用例是「静默失败」的回归防线（用例名里带 ★ 的都是），必须在 CI 里跑 ——
  # 只在开发机上手动跑，等于没有防线。
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # ── 集群侧自测 ──────────────────────────────────────────────────────────────
  # 注意：有人可能会以为这个测试需要真集群才能跑。**不需要** ——
  # 它对 Slurm 的调用全部打了桩（替换 run_cmd），测的是解析逻辑本身。
  # 所以它能在裸的 ubuntu-latest 上跑，也【应该】在这里跑：
  # 以前它只在开发机上手动跑过，等于没有回归防线。
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'      # 与部署目标（RHEL 9 系）一致，不用更新的语法
      - name: 守护进程自测
        run: python3 cluster/test-sessiond-logic.py
      - name: 比对器自测
        # nft-compare.py 自带用例，验证"非干扰比对"这个安全保证本身是有效的
        run: python3 cluster/nft-compare.py --selftest

  # ── 符合性向量：三份实现对同一批字节必须得出同一个答案 ──────────────────────
  # 三份实现分别在 JS（打包器）、Python（守护进程）、JS（客户端）里。它们漂开的
  # 后果是**同一个包，打包器说它合规、客户端说它不合规** —— 而用户看到的是
  # "作者说打好了、我就是装不上"。
  #
  # 钉住它们的是 tools/conformance/：一份固定的输入树、一份期望的包字节、一批
  # 坏包（每条带一个期望的**理由词**）。三端的用例各自读同一批十六进制。
  #
  # ★ 两个方向都要跑：
  #   · 生成器跑一遍必须**不产生 diff** —— 否则夹具与输入树/生成器已经对不上了，
  #     而三端会一起错得一样（"三端一致"变成"三端一起过时"）。
  #   · 打包器的用例（它顺带把客户端那一份读方拉进来对答案）。
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 用例
        run: node packer/test-packer.mjs
      - name: 夹具与生成器一致
        run: |
          node tools/conformance/generate.mjs > /dev/null
          if ! git diff --exit-code -- tools/conformance/; then
            echo "✗ expected.json / bad.json 与输入树或生成器对不上了。"
            echo "  重跑一次 node tools/conformance/generate.mjs 并提交，别手改那两个文件。"
            exit 1
          fi
          echo "✓ 夹具与输入树一致"

  # ── 语法与一致性 ────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Shell 语法
        run: |
          fail=0
          # ★ '*.sbatch' 必须在这里。作业模板与（部署之后）每插件一份的作业脚本
          #   都是 .sbatch，没有 .sh 后缀 —— 而它们恰恰是**用户真的会执行**的
          #   那两份 shell。此前 run.sbatch 就是从这个清单里漏掉的。
          #   仓库里只有模板（成品在 <prefix>/share/slurmate/jobs/，不进仓库），
          #   所以这条扫的是模板；成品那一份的语法由 deploy.sh 的 bash -n 挡。
          for f in $(git ls-files '*.sh' '*.sbatch' cluster/deploy.sh tools/*.sh); do
            [ -f "$f" ] || continue
            if bash -n "$f"; then echo "  ok   $f"; else echo "  FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Python 语法
        run: |
          fail=0
          for f in cluster/slurmate cluster/slurmate-sessiond cluster/nft-compare.py \
                   cluster/test-sessiond-logic.py; do
            if python3 -m py_compile "$f"; then echo "  ok   $f"; else echo "  FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: 版本号：四处逐字一致，且形状是 x.y
        # 协议版本、客户端版本、服务端版本**是同一个号** —— 它落在四个文件里
        # （client/package.json、client/package-lock.json、cluster/slurmate、
        # cluster/slurmate-sessiond），没有任何机制保证它们同步。
        #
        # ★ **第四处是真的漏过一次的**：client/package-lock.json 从前停在 0.2.0，
        #   而 package.json 已经走到 0.6.0 —— 因为 `npm ci` **不比较**lock 里那个
        #   根 version 字段，所以它一直没人发现。不一致的后果是：安装包叫 0.6，
        #   而它在联系的服务端自称 0.5，排查时无从对起。
        #
        # ★ **形状那一半不在这里重写一遍正则。** 正则的第二个抄本正是这条 lint
        #   要防的那种漂；这里从守护进程 import 那一份（它与客户端
        #   `plugins/index.js` 的 FRAMEWORK_VERSION_RE 由
        #   tools/version-fixtures.json 与两边的用例对齐）。
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util, json, re, sys

          ldr = importlib.machinery.SourceFileLoader("d", "cluster/slurmate-sessiond")
          mod = importlib.util.module_from_spec(
              importlib.util.spec_from_loader("d", ldr))
          ldr.exec_module(mod)
          SHAPE = mod.FRAMEWORK_VERSION_RE

          def daemon_version(path):
              src = open(path, encoding="utf-8").read()
              m = re.search(r'^VERSION\s*=\s*"([^"]+)"', src, re.M)
              return m.group(1) if m else ""

          def from_json(path):
              return json.load(open(path, encoding="utf-8")).get("version") or ""

          places = [
              ("client/package.json", from_json("client/package.json")),
              ("client/package-lock.json", from_json("client/package-lock.json")),
              ("cluster/slurmate", daemon_version("cluster/slurmate")),
              ("cluster/slurmate-sessiond", daemon_version("cluster/slurmate-sessiond")),
          ]
          bad = 0
          for name, v in places:
              ok = bool(v) and SHAPE.match(v) is not None
              print("  %-26s %-10s %s" % (name, v or "(空)", "ok" if ok else "FAIL 不是 x.y"))
              if not ok:
                  bad = 1
          if len({v for _n, v in places}) > 1:
              print("✗ 四处版本号不一致：%s" % sorted(v for _n, v in places))
              print("  改版本时四处都要改（或改成本 workflow 从单一来源派生）。")
              bad = 1
          if bad:
              sys.exit(1)
          print("✓ 四处一致，且都是 x.y")
          PY

      - name: 插件的跳过表三端必须一致
        # ★ 站点分发时，客户端按**自己算的**摘要与站点报的那个比（v0.7 起两边比的
        #   都是包里那张记录表；v0.6 时客户端还比过站点报的逐份 sha256）。两边的
        #   跳过表（哪些目录名不算插件内容）分别在 JS 与 Python 里，**没有任何共享
        #   机制** —— 漂开之后症状是"同步一直失败"，而报错里一个字都不会提到是这两
        #   个集合分家了。
        #
        #   与上面那条"版本号"同一个先例：靠约定维持的跨文件一致性，要有东西钉住。
        #   （cluster/test-sessiond-logic.py 的 19.12 有一条同样意思的用例，本地跑得
        #   到；这里再来一条是因为 CI 上的 lint 是**最外层**的那道网，它不依赖测试
        #   脚本被正确地调用。）
        # ★ 抽的是 `client/src/main/plugins/index.js` —— 那个集合**全客户端只有一份**，
        #   摘要（digestOf / readPluginFiles）与站点分发那条路都从它引。以前它在
        #   install.js 里，两份实现各自持有一份，正是这条 lint 要防的那种分家。
        #   （install.js 那个文件已经随"本机池"一起删掉了，这条 lint 照旧 —— 它抽的
        #   常量不在那个文件里。）
        #
        # ★ **从两端变成三端**：打包器（packer/slurmate-packer.js）现在也有自己
        #   一份，而那是没办法的 —— 它要"下载这个文件夹就能用"，所以 import 不到
        #   客户端里的常量。这条 lint 就是那份代价的对价。
        #   ★ 它与规范 §3.3 里"禁止出现下列跳过集合里的任何一段"是**同一条规则的
        #   两种用法**：打包器**排除**它们，读方**拒绝**含它们的包。
        #
        #   同一条意思在 packer/test-packer.mjs 与 cluster/test-sessiond-logic.py
        #   的 19.12 里各有一条（本地跑得到）；这里再来一条是因为 CI 上的 lint 是
        #   **最外层**的那道网，它不依赖测试脚本被正确地调用。
        run: |
          a=$(sed -nE "s/^const COPY_SKIP = new Set\(\[([^]]*)\]\).*/\1/p" \
                client/src/main/plugins/index.js \
              | tr ',' '\n' | grep -oE "'[^']*'" | tr -d "'" | sort)
          b=$(sed -nE "s/^PLUGIN_COPY_SKIP = \((.*)\)$/\1/p" \
                cluster/slurmate-sessiond \
              | tr ',' '\n' | grep -oE '"[^"]*"' | tr -d '"' | sort)
          c=$(sed -nE "s/^const COPY_SKIP = new Set\(\[([^]]*)\]\).*/\1/p" \
                packer/slurmate-packer.js \
              | tr ',' '\n' | grep -oE "'[^']*'" | tr -d "'" | sort)
          echo "客户端 plugins/index.js : $(echo $a)"
          echo "守护进程                : $(echo $b)"
          echo "打包器                  : $(echo $c)"
          if [ -n "$a" ] && [ "$a" = "$b" ] && [ "$b" = "$c" ]; then
            echo "✓ 三端一致"
          else
            echo "✗ 三端的跳过表不一致（或有一边没抽出来）。"
            echo "  它们必须逐字相同：客户端算的摘要要与站点报的对得上，"
            echo "  而打包器排除的那些必须正好是读方拒绝的那些。"
            exit 1
          fi

      - name: 清单里认得的键：书面判据与两侧逐字一致
        # ★ 与上面那条"跳过表三端必须一致"同一个形状，差别是这里多了一份**书面的**
        #   判据（tools/manifest-keys.json）—— 它是这几张表唯一可读的落点，而生产
        #   代码**不能**在运行期读它：守护进程是一个文件装到 /usr/local/sbin/（集群
        #   上没有 tools/），客户端是一个分发单元（运行期只读 client/ 里的东西）。
        #   两侧各写一条相对路径的话，从源码跑得通、装出去就断 —— 键表成了空集，
        #   于是"什么都不拒"，而那只在装出去的机器上露出来。理由与代价都写在
        #   那份 JSON 的 `_` 段里。
        #
        #   三处必须逐字相同（**有序**：报错里"认识的只有 …"那一串用的就是它）：
        #   书面判据 / 客户端那五张字面量 / 守护进程那五张元组。漂开的后果是
        #   "客户端拒、守护进程收"—— 站点能把一个任何客户端都装不上的插件正常
        #   分发出去，而报错里一个字都不会提到是这两组键分了家（账本 S12）。
        #
        #   抠的是**字面量**，不是"跑一遍 JS" —— 与上面那条同一个理由（本机不一定
        #   有 node），而这条契约要的正是"两份声明写的是同一组名字"。
        #
        #   同一条意思在 client/test/manifest-keys.test.mjs 与
        #   cluster/test-sessiond-logic.py 的 19.16 里各有一条（本地跑得到）；
        #   这里再来一条是因为 CI 上的 lint 是**最外层**的那道网，它不依赖测试
        #   脚本被正确地调用。
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util, json, re, sys

          TABLES = [("manifest", "MANIFEST_KEYS"),
                    ("contributes", "CONTRIBUTES_KEYS"),
                    ("surface", "SURFACE_KEYS"),
                    ("login", "LOGIN_KEYS"),
                    ("data", "DATA_KEYS")]

          written = json.load(open("tools/manifest-keys.json", encoding="utf-8"))
          js = open("client/src/main/plugins/index.js", encoding="utf-8").read()

          ldr = importlib.machinery.SourceFileLoader("d", "cluster/slurmate-sessiond")
          mod = importlib.util.module_from_spec(
              importlib.util.spec_from_loader("d", ldr))
          ldr.exec_module(mod)

          bad = 0
          for name, const in TABLES:
              m = re.search(r"const %s = \[([^\]]*)\]" % const, js, re.S)
              client = re.findall(r"'([^']*)'", m.group(1)) if m else None
              daemon = list(getattr(mod, const, ()))
              w = written.get(name)
              # ★ 三个都非空才算数：`[] == [] == None` 那种假通过正是这一条要防的。
              ok = bool(client) and bool(daemon) and w == client == daemon
              print("  %-12s %s" % (name, "ok" if ok else "FAIL"))
              if not ok:
                  bad = 1
                  print("      书面 %r" % (w,))
                  print("      客户端 %r / 守护进程 %r" % (client, daemon))
          if bad:
              print("✗ 清单键三处不一致（或有一处没抠出来）。")
              print("  它们必须逐字相同：改规则要同时改 tools/manifest-keys.json")
              print("  与两侧的实现（client/src/main/plugins/index.js /")
              print("  cluster/slurmate-sessiond）。")
              sys.exit(1)
          print("✓ 书面判据 = 客户端 = 守护进程（五张表，十五处都真的抠到了）")
          PY

      - name: 插件负载上限：书面判据与三侧逐字一致
        # ★ 与上面两条（版本号、跳过表、清单键）同一个形状。这一组数比它们更宽的
        #   地方是**三份**实现各写一遍：客户端（site-plugins.js 的 HARD_LIMITS）、
        #   守护进程（PLUGIN_*）、打包器（MAX_*）。三份都是分发单元，谁也读不到
        #   tools/plugin-limits.json（守护进程是一个文件装到 /usr/local/sbin/，
        #   客户端是一个分发单元，打包器要"下载这个文件夹就能用"）—— 所以那份
        #   JSON 是**书面判据**，不是运行期依赖。理由与代价写在它的 `_` 段里。
        #
        #   漂开的样子：客户端收下一个站点根本发不出来的负载；或者打包器放出一个
        #   **任何站点都拒收**的包。两种都不红任何东西，直到有人真的发布一个插件。
        #
        #   ★ `total_bytes` 是**推出来的**（包上限 − 信封最坏情况），所以这里除了
        #   三处逐字相同，还要验那条推导本身 —— 否则一份自己就不自洽的书面判据会
        #   让三条比对一起绿。
        #
        #   抠的是**字面量**，不是"跑一遍 JS"（本机不一定有 node）；这几个表达式
        #   在 Python 与 JS 里逐字同解（`1 << 20`、`256 * 1024`、加减乘与括号）。
        #
        #   同一条意思在 client/test/limits.test.mjs、packer/test-packer.mjs 与
        #   cluster/test-sessiond-logic.py 的 19.17 里各有一条（本地跑得到）；
        #   这里再来一条是因为 CI 上的 lint 是**最外层**的那道网，它不依赖测试
        #   脚本被正确地调用。
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util, json, re, sys

          def lits(src, names):
              """把一串 `const NAME = <纯算术>;` 求值出来（声明次序即依赖次序）。
                 抠不到或算不动就返回 None —— 这一层不许把异常当成通过。"""
              env = {}
              for n in names:
                  m = re.search(r"^const %s = (.+);$" % n, src, re.M)
                  if not m:
                      return None
                  try:
                      env[n] = eval(m.group(1), {"__builtins__": {}}, env)
                  except Exception:
                      return None
              return env

          written = json.load(open("tools/plugin-limits.json", encoding="utf-8"))
          load, pkg, fmt = written["load"], written["package"], written["format"]
          csrc = open("client/src/main/site-plugins.js", encoding="utf-8").read()
          psrc = open("packer/slurmate-packer.js", encoding="utf-8").read()

          ldr = importlib.machinery.SourceFileLoader("d", "cluster/slurmate-sessiond")
          mod = importlib.util.module_from_spec(
              importlib.util.spec_from_loader("d", ldr))
          ldr.exec_module(mod)

          cv = lits(csrc, ("MAX_SEGMENT_BYTES", "MAX_DEPTH", "MAX_FILES",
                           "MAX_PATH_BYTES", "ENVELOPE_MAX_BYTES"))
          pv = lits(psrc, ("MAX_DEPTH", "MAX_SEGMENT_BYTES", "MAX_FILES",
                           "MAX_FILE_BYTES", "MAX_PACKAGE_BYTES",
                           "MAX_PATH_BYTES", "MAX_ENVELOPE_BYTES", "MAX_TOTAL_BYTES"))
          hv = None
          hm = re.search(r"const HARD_LIMITS = \{(.*?)\n\};", csrc, re.S)
          if hm is not None and cv is not None:
              hv = {}
              for line in hm.group(1).split("\n"):
                  kv = re.match(r"\s*(\w+): (.+?),?\s*$", line)
                  if not kv:
                      continue
                  try:
                      hv[kv.group(1)] = eval(kv.group(2), {"__builtins__": {}}, cv)
                  except Exception:
                      hv = None
                      break

          bad = 0
          def say(name, ok, detail=""):
              global bad
              print("  %-34s %s%s" % (name, "ok" if ok else "FAIL",
                                      "" if ok else "  " + detail))
              if not ok:
                  bad = 1

          # ★ 先证明"抠到了"：`None == None` 那种假通过正是这一条要防的。
          say("三侧字面量都抠到了",
              cv is not None and pv is not None and hv is not None
              and set(hv) == {"file_bytes", "total_bytes", "max_files", "max_depth",
                              "package_bytes"},
              "客户端 %r / 打包器 %r / HARD_LIMITS %r" % (cv, pv, hv))
          say("客户端 = 书面判据",
              hv is not None and all(hv[k] == load[k] for k in
                                     ("file_bytes", "total_bytes", "max_files", "max_depth")),
              "%r vs %r" % (hv, load))
          # ★ 深度上限在客户端里有两份：site-plugins.js 的（上面那条钉了）与
          #   plugin-package.js 的 —— 后者传给共享的 checkRelPath，也就是"读一个包
          #   时允许多深"的那个数，而坏包向量里没有"路径超过深度"的用例。
          pksrc = open("client/src/main/plugin-package.js", encoding="utf-8").read()
          pkm = re.search(r"^const MAX_DEPTH = (\d+);$", pksrc, re.M)
          say("客户端第二份深度上限（plugin-package.js）",
              pkm is not None and int(pkm.group(1)) == load["max_depth"],
              "抠到 %r" % (pkm and pkm.group(1),))

          say("守护进程 = 书面判据",
              mod.PLUGIN_FILE_MAX_BYTES == load["file_bytes"]
              and mod.PLUGIN_TOTAL_MAX_BYTES == load["total_bytes"]
              and mod.PLUGIN_MAX_FILES == load["max_files"],
              "%s / %s / %s" % (mod.PLUGIN_FILE_MAX_BYTES, mod.PLUGIN_TOTAL_MAX_BYTES,
                                mod.PLUGIN_MAX_FILES))
          say("打包器 = 书面判据",
              pv is not None and pv["MAX_FILE_BYTES"] == load["file_bytes"]
              and pv["MAX_TOTAL_BYTES"] == load["total_bytes"]
              and pv["MAX_FILES"] == load["max_files"]
              and pv["MAX_DEPTH"] == load["max_depth"],
              "%r" % (pv,))

          # 推导：信封最坏情况（附录 A.1 + §3.3），以及 total = 包上限 − 它。
          path_bytes = load["max_depth"] * fmt["max_segment_bytes"] + (load["max_depth"] - 1)
          env = (fmt["header_bytes"] + fmt["signature_bytes"]
                 + load["max_files"] * (fmt["record_overhead_bytes"] + path_bytes))
          say("信封最坏情况算得出来（%d 字节）" % env,
              env == pkg["envelope_max_bytes"],
              "现算 %d vs 判据 %d" % (env, pkg["envelope_max_bytes"]))
          say("负载上限 = 包上限 − 信封最坏情况",
              load["total_bytes"] == pkg["max_bytes"] - pkg["envelope_max_bytes"],
              "%d vs %d" % (load["total_bytes"], pkg["max_bytes"] - pkg["envelope_max_bytes"]))
          say("按上限做的包装得进包上限（算出来的）",
              load["total_bytes"] + env <= pkg["max_bytes"],
              "%d + %d > %d" % (load["total_bytes"], env, pkg["max_bytes"]))

          if bad:
              print("✗ 插件负载上限三处不一致（或有一处没抠出来）。")
              print("  改规则要同时改 tools/plugin-limits.json 与三侧的实现：")
              print("  client/src/main/site-plugins.js（深度那一项还有")
              print("  client/src/main/plugin-package.js）/ cluster/slurmate-sessiond /")
              print("  packer/slurmate-packer.js。")
              sys.exit(1)
          print("✓ 书面判据 = 客户端 = 守护进程 = 打包器")
          PY
