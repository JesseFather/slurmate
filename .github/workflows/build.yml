name: build

# 把 client/ 打成三个平台的安装包，把 cluster/ 拼成站点端的单文件包。
#
# ── 只在手动触发时跑 ───────────────────────────────────────────────────────
# 分支上只跑 checks.yml（不到一分钟）；构建只在打 tag 时由 release.yml 做一次，
# 一次运行里产出产物并开 Release，不重复。
#
# 这一份留着是因为"打 tag 之前先确认三个平台都装得上"仍有价值：它只产出附件，
# 不碰 Release，打坏了删掉那次运行即可。合并之后不自动跑 —— 一次三平台打包
# 约 100 分钟，而 tag 那一次已经覆盖了同样的东西。
#
# 发布（打 tag → 挂 Release）在 release.yml 里，故意分开。
# 原因见 release.yml 顶部的说明：GitHub 对 push 事件是把 branches + tags + paths
# 三者取【与】的，而给一个已推送的提交打 tag 时变更文件集为空 —— 只要这个
# workflow 带 paths 过滤器，release 就永远不会触发，且失败时没有任何报错。
#
# ── 关于 CI 时间 ────────────────────────────────────────────────────────────
# Actions 分钟数按平台加权：Linux 1× / Windows 2× / macOS 10×。
# 测试只在 Linux 上跑一遍；三个平台只打各自的包，不再各跑一遍测试
# （客户端用例里有 POSIX 权限位与符号链接，Windows 上本来就不成立）。
on:
  workflow_dispatch:

# 同一分支上连推多次时，取消排队中的旧运行，只跑最新的。
# 没有这个的话，改一行注释就会排起一串约 100 分钟的任务。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先在 Linux 上跑测试 —— 不需要 Electron 运行时，十几秒就完。
  # 测试挂了就不必再花 100 分钟去打三个平台的包。
  #
  # 注意 `defaults.run.working-directory` 只对 `run:` 步骤生效，
  # 对 `uses:` 步骤无效 —— 所以下面 upload-artifact 的 path 要写全 `client/dist/...`。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # electron-builder 的依赖树要求 ^20.17.0 || >=22.9.0，
          # 而 Node 20 已在 2026-04 EOL。用 22。
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      # npm ci 而不是 npm install：既装依赖，也顺带校验 lockfile 与
      # package.json 是否一致（有人改了后者忘了前者，这里就会红）。
      - run: npm ci
      - run: npm test

  # 站点端与打包器：同一个版本、同一次发布。
  #   站点端是守护进程、CLI、作业模板、部署脚本与文档拼成的一个 `.run`；
  #   打包器是单文件零依赖的脚本，插件作者拿走就能用。
  #   两者都没有三个平台，所以不进下面的矩阵；测试也不必等客户端那一套。
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 单文件包自测
        # 打包器的失败路径（源文件缺失、包体标记错位、解出来的与放进去的不同）
        # 都在这一份里。先证它打得出，再打真的那一份。
        run: python3 cluster/test-run-package.py
      - name: 打包
        run: bash cluster/make-run.sh
      - name: 打包器
        # 单文件零依赖，与基座同一个版本；放进 dist，与站点包一起上传。
        # 文档嵌在这一份文件里（作者手上只有它），版本号取自同一个 VERSION 行。
        run: node packer/make-packer.js
      - name: 摘要
        # 产物在 Actions 页面上只给一个名字；管理员拿它认包靠 sha256，
        # 所以把这一份里的每个文件都写进本次运行的摘要。
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: slurmate-base
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build:
    needs: test
    strategy:
      fail-fast: false          # 一个平台挂了，另外两个的产物仍要拿到
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: 打包
        # shell: bash 是必须的：三平台矩阵，Windows 的默认 shell 是 PowerShell。
        # --publish never：只产出安装包，不碰 Release。
        # 发布是 release.yml 的事，这里不需要 GH_TOKEN。
        # --config.buildVersion：文件名用两段的发布标识，来源与站点包同一个
        #   （cluster/slurmate-sessiond 的 RELEASE）。
        shell: bash
        run: |
          rel="$(sed -n 's/^RELEASE = "\(.*\)"$/\1/p' ../cluster/slurmate-sessiond)"
          if [ -z "$rel" ]; then
            echo "读不到 cluster/slurmate-sessiond 的 RELEASE" >&2
            exit 1
          fi
          npx electron-builder --publish never --config.buildVersion="$rel"
      - uses: actions/upload-artifact@v4
        with:
          name: slurmate-${{ matrix.os }}
          path: |
            client/dist/*.exe
            client/dist/*.dmg
            client/dist/*.AppImage
            client/dist/*.deb
            client/dist/*.zip
          if-no-files-found: error
          retention-days: 30
